name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Least privilege by default; jobs opt in to anything more.
permissions:
  contents: read

# One run per branch/PR: a new push cancels the stale run. Never cancel on main,
# so every merged commit gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: '1'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment)
# so a moved or compromised tag cannot change what runs. Dependabot bumps them.
jobs:
  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Versioned image bundles shellcheck, so `run:` scripts are linted too.
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Blocks service_role/secret keys, server-only env names and quiz
      # answer fields from ever shipping in the browser bundle.
      - name: Check the build exposes no secrets or quiz answers
        run: npm run check:dist
      - name: Fail if the build left the working tree dirty
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The build modified tracked files or created untracked ones:"
            git status --porcelain
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify registry signatures and provenance
        run: npm audit signatures
      - name: Audit production dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Dependency review needs the repo's Dependency graph (Settings > Code
      # security). GitHub answers 404 on this endpoint only when the graph is
      # disabled: skip with a warning then, so the check re-activates by itself
      # once an admin enables it. Any other error fails the job.
      - name: Check Dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/dependency-graph/sbom")
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              msg="Dependency graph is disabled, so dependency review was skipped. A repo admin can enable it at https://github.com/$REPO/settings/security_analysis"
              echo "::warning title=Dependency review skipped::$msg"
              echo "### ⚠️ Dependency review skipped" >> "$GITHUB_STEP_SUMMARY"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Unexpected HTTP $status checking the Dependency graph."
              exit 1
              ;;
          esac
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  db:
    name: Database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Same version as the db:* scripts in package.json.
          version: 3.1.0
      # Applies every migration in supabase/migrations and then seed.sql.
      # Services the database tests don't need are skipped to save time.
      - run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector
      # pgTAP tests in supabase/tests (RLS, triggers, constraints).
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup

  # Single stable check for branch protection: require only "CI passed".
  # Fails if any needed job failed or was cancelled; skipped jobs are allowed
  # (e.g. dependency-review outside pull requests).
  ci-passed:
    name: CI passed
    if: always()
    needs:
      [
        workflow-lint,
        format,
        lint,
        typecheck,
        test,
        build,
        security,
        dependency-review,
        db,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::One or more required jobs did not succeed."
              exit 1
            fi
          done
